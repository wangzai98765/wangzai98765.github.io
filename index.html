/* 刘琦个人简历网站 · 样式
   视觉依据：PRD-figma.md；色值、圆角、间距均来自该文档 */
:root{
  --bg:#fff; --bg-soft:#fafafa; --ink:#1a1a1a; --ink-2:#555; --ink-3:#888;
  --line:#eee; --pill:#f0f4f8;
  --blue:#e3f2fd; --blue-d:#1976d2;
  --green:#e8f5e9; --green-d:#388e3c;
  --orange:#fff3e0; --orange-d:#ef6c00;
  --purple:#f3e5f5; --purple-d:#8e24aa;
  --btn-green:#dcedc8; --btn-green-h:#d0e5b8;
  --r-card:16px; --r-banner:18px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --nav-h:68px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
section[id],header[id]{scroll-margin-top:80px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

/* ---------- 导航（吸顶） ---------- */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:17px;letter-spacing:.01em}
.nav-links{display:flex;gap:6px}
.nav-links a{display:block;padding:8px 18px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--ink-2);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{background:var(--ink);color:#fff;font-weight:600}

/* ---------- 首屏 ---------- */
.hero{padding:56px 0 0;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:end}
.hero-text{padding-bottom:96px;align-self:center}
.hero-photo{display:flex;justify-content:center;align-items:flex-end;align-self:end}
.hero-photo img{display:block;width:auto;height:auto;max-width:100%;max-height:600px;object-fit:contain}
.hero h1{font-size:52px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
.lede{margin-top:22px;max-width:640px;font-size:17px;color:var(--ink-2);line-height:1.75}
.hero-btns{margin-top:36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 30px;border-radius:999px;
  font-size:15px;font-weight:600;border:1.5px solid var(--ink);transition:background .2s,transform .2s}
.btn-outline{background:transparent}
.btn-outline:hover{background:var(--pill)}
.btn-solid{background:var(--btn-green);border-color:var(--btn-green)}
.btn-solid:hover{background:var(--btn-green-h);border-color:var(--btn-green-h)}
.hero-mail{margin-left:6px;font-size:14.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;user-select:text}
.hero-mail:hover{color:var(--ink)}

/* ---------- 通用板块 ---------- */
.sec{padding:80px 0;border-top:1px solid var(--line)}
.sec-title{text-align:center;font-size:40px;font-weight:900;line-height:1.3}
.sec-sub{text-align:center;margin:8px 0 56px;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--ink-3)}

/* ---------- 教育背景 ---------- */
.edu-intro{text-align:center;margin:-24px 0 40px;font-size:24px;font-weight:700;line-height:1.5;color:var(--ink)}
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:920px;margin:0 auto}
.edu-card{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--bg)}
.edu-img{aspect-ratio:16/9;background:linear-gradient(135deg,#dfe7ee,#c9d6e2);overflow:hidden}
.edu-img img{width:100%;height:100%;object-fit:cover;display:block}
.edu-body{padding:18px 22px 22px}
.edu-tags{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill-dark{background:var(--ink);color:#fff}
.pill-soft{background:var(--pill);color:var(--ink-2)}
.edu-name{font-size:20px;font-weight:700}

/* ---------- 实习经历 ---------- */
.exp{max-width:920px;margin:0 auto}
.exp + .exp{margin-top:88px}
.exp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.exp-head h3{font-size:26px;font-weight:800;line-height:1.35}
.exp-role{margin-top:4px;font-size:14.5px;font-weight:600;color:var(--blue-d)}
.exp-period{font-size:13.5px;color:var(--ink-3);padding-top:6px;white-space:nowrap}
.exp-overview{margin-top:14px;max-width:760px;font-size:15px;color:var(--ink-2);line-height:1.75}
.exp-tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.exp-tags span{padding:6px 16px;border-radius:999px;background:var(--pill);font-size:13px;color:var(--ink-2)}
.divider{display:flex;align-items:center;gap:16px;margin:40px 0 26px;font-size:13px;letter-spacing:.15em;color:var(--ink-3)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cards.two{grid-template-columns:repeat(2,1fr)}
.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;
  background:var(--bg);padding:0;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,.07)}
.card-cover{height:110px;display:flex;align-items:center;justify-content:center}
.cov-0{background:linear-gradient(135deg,#e3f2fd,#f3e5f5)}
.cov-1{background:linear-gradient(135deg,#e8f5e9,#fff3e0)}
.cov-2{background:linear-gradient(135deg,#fff3e0,#e3f2fd)}
.ico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-body{flex:1;display:flex;flex-direction:column;padding:20px 22px 22px}
.card-body h4{font-size:16.5px;font-weight:700;line-height:1.45}
.card-body p{flex:1;margin-top:6px;font-size:13.5px;color:var(--ink-2);line-height:1.65}
.card-link{margin-top:16px;font-size:13.5px;font-weight:700}
.card-link span{border-bottom:2px solid var(--ink);padding-bottom:1px}

/* ---------- 技能 ---------- */
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:920px;margin:0 auto}
.skill-card{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--bg)}
.skill-head{display:flex;align-items:baseline;gap:10px;padding:14px 24px;font-size:17px;font-weight:700}
.skill-head em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.14em;opacity:.55}
.skill-card ul{padding:16px 24px 20px}
.skill-card li{position:relative;padding:5px 0 5px 18px;font-size:14.5px;color:var(--ink-2)}
.skill-card li::before{content:"";position:absolute;left:0;top:15px;width:7px;height:7px;border-radius:50%}
.c-blue .skill-head{background:var(--blue)}   .c-blue li::before{background:var(--blue-d)}
.c-green .skill-head{background:var(--green)} .c-green li::before{background:var(--green-d)}
.c-orange .skill-head{background:var(--orange)} .c-orange li::before{background:var(--orange-d)}
.c-purple .skill-head{background:var(--purple)} .c-purple li::before{background:var(--purple-d)}

/* ---------- 页脚 ---------- */
.footer{border-top:1px solid var(--line);padding:80px 0;min-height:620px;display:flex;align-items:center}
.footer .wrap{width:100%}
.footer-in{display:grid;grid-template-columns:1.45fr 1fr;gap:56px;align-items:center}
.slogan{font-size:36px;font-weight:900;line-height:1.45;letter-spacing:-.01em;max-width:none}
.slogan-next{margin-top:28px;font-size:26px;font-weight:800}
.f-list{border-top:1px solid var(--line)}
.f-list li{border-bottom:1px solid var(--line)}
.f-list li,.f-row{display:flex;align-items:center;gap:16px}
.f-list li{padding:0}
.f-list li>.f-tag,.f-list li>.f-val,.f-list li>.f-arrow{padding-top:26px;padding-bottom:26px}
.f-row{flex:1;padding:26px 0}
.f-row:hover .f-val{text-decoration:underline;text-underline-offset:4px}
.f-tag{width:84px;flex-shrink:0;font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--ink-3)}
.f-val{flex:1;font-size:19px;user-select:text}
.f-arrow{font-size:22px;color:var(--ink-3)}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s}
.mask.open{opacity:1;visibility:visible}
.modal{width:100%;max-width:860px;max-height:calc(100vh - 48px);overflow-y:auto;background:var(--bg);border-radius:28px;padding:32px 36px 36px;
  transform:translateY(16px);transition:transform .25s ease;box-shadow:0 24px 80px rgba(0,0,0,.2)}
.mask.open .modal{transform:translateY(0)}
.m-banner{border-radius:var(--r-banner);padding:26px 32px}
.m-banner h3{font-size:24px;font-weight:800;line-height:1.35}
.m-banner em{display:block;margin-top:4px;font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.18em;opacity:.55}
.b-blue{background:var(--blue)} .b-green{background:var(--green)} .b-orange{background:var(--orange)} .b-purple{background:var(--purple)}
.m-sub{margin-top:24px;font-size:17px;font-weight:700}
.m-h{margin-top:26px;font-size:18px;font-weight:800}
.m-sub + .m-h{margin-top:20px}
.m-en{margin:2px 0 14px;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--ink-3)}
.duties{display:grid;gap:14px}
.duties.n4{grid-template-columns:repeat(4,1fr)}
.duties.n3{grid-template-columns:repeat(3,1fr)}
.duties.n2{grid-template-columns:repeat(2,1fr)}
.duty{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.duty-top{padding:11px 16px;font-size:14.5px;font-weight:700}
.duty ul{padding:12px 16px 16px}
.duty li{position:relative;padding:3px 0 3px 14px;font-size:13px;color:var(--ink-2);line-height:1.6}
.duty li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%}
.d-0 .duty-top{background:var(--blue)}   .d-0 li::before{background:var(--blue-d)}
.d-1 .duty-top{background:var(--green)}  .d-1 li::before{background:var(--green-d)}
.d-2 .duty-top{background:var(--orange)} .d-2 li::before{background:var(--orange-d)}
.d-3 .duty-top{background:var(--purple)} .d-3 li::before{background:var(--purple-d)}
.results{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.results.n2{grid-template-columns:repeat(2,1fr)}
.result{background:#efefef;border-radius:14px;padding:18px 20px}
.result .num{font-size:24px;font-weight:900;line-height:1.3}
.result .lab{margin-top:2px;font-size:12.5px;color:var(--ink-2)}
.m-close{margin-top:30px;height:44px;padding:0 32px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;transition:opacity .2s}
.m-close:hover{opacity:.85}
body.no-scroll{overflow:hidden}

/* ---------- 响应式（≤860px） ---------- */
@media (max-width:860px){
  .wrap{padding:0 20px}
  .nav-links{display:none}
  .hero{padding:40px 0 0}
  .hero-in{grid-template-columns:1fr;gap:0}
  .hero-text{padding-bottom:36px}
  .hero-photo img{max-height:420px}
  .hero h1{font-size:36px}
  .lede{font-size:16px}
  .btn{height:48px}
  .hero-mail{width:100%;margin:4px 0 0}
  .sec{padding:56px 0}
  .sec-title{font-size:32px}
  .sec-sub{margin-bottom:36px}
  .edu-intro{margin-top:-12px;margin-bottom:28px;font-size:19px}
  .edu-grid,.cards,.cards.two,.skill-grid{grid-template-columns:1fr}
  .exp + .exp{margin-top:64px}
  .exp-head h3{font-size:22px}
  .footer{padding:64px 0;min-height:0}
  .footer-in{grid-template-columns:1fr;gap:40px}
  .slogan{font-size:30px}
  .slogan-next{font-size:20px}
  .f-val{font-size:16px}
  .mask{padding:12px;align-items:flex-end}
  .modal{max-height:calc(100vh - 24px);border-radius:24px;padding:20px 18px 24px}
  .m-banner{padding:20px 22px}
  .m-banner h3{font-size:20px}
  .duties.n4,.duties.n3,.duties.n2{grid-template-columns:repeat(2,1fr)}
  .results,.results.n2{grid-template-columns:1fr}
  .m-close{width:100%;height:48px}
}
@media (max-width:480px){
  .duties.n4,.duties.n3,.duties.n2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms!important}
}

</style>

<script>
/* 渲染与交互逻辑：数据全部来自 data.js */
(function () {
  'use strict';
  var D = window.SITE;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  /* ---------- 教育背景 ---------- */
  $('#eduGrid').innerHTML = D.education.map(function (e) {
    return '<article class="edu-card">' +
      '<div class="edu-img"><img src="' + e.img + '" alt="' + esc(e.school) + '校园" loading="lazy" onerror="this.remove()"></div>' +
      '<div class="edu-body"><div class="edu-tags">' +
      '<span class="pill pill-dark">' + esc(e.degree) + ' · ' + esc(e.status) + '</span>' +
      '<span class="pill pill-soft">' + esc(e.badge) + '</span></div>' +
      '<div class="edu-name">' + esc(e.school) + '</div></div></article>';
  }).join('');

  /* ---------- 实习经历 ---------- */
  $('#expList').innerHTML = D.experiences.map(function (x) {
    var cards = x.cards.map(function (c, i) {
      return '<button class="card" type="button" data-modal="' + c.id + '" aria-haspopup="dialog">' +
        '<div class="card-cover cov-' + (i % 3) + '"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + D.icons[c.icon] + '</svg></div></div>' +
        '<div class="card-body"><h4>' + esc(c.title) + '</h4><p>' + esc(c.subtitle) + '</p>' +
        '<div class="card-link"><span>查看详情 ↗</span></div></div></button>';
    }).join('');
    return '<article class="exp">' +
      '<div class="exp-head"><div><h3>' + esc(x.swap ? x.role : x.company) + '</h3><div class="exp-role">' + esc(x.swap ? x.company : x.role) + '</div></div>' +
      '<span class="exp-period">' + esc(x.period) + '</span></div>' +
      (x.overview ? '<p class="exp-overview">' + esc(x.overview) + '</p>' : '') +
      (x.tags.length ? '<div class="exp-tags">' + x.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="divider">项 目 经 历</div>' +
      '<div class="cards' + (x.cards.length === 2 ? ' two' : '') + '">' + cards + '</div></article>';
  }).join('');

  /* ---------- 技能 ---------- */
  $('#skillGrid').innerHTML = D.skills.map(function (s) {
    return '<div class="skill-card c-' + s.color + '"><div class="skill-head">' + esc(s.title) + ' <em>' + esc(s.en) + '</em></div><ul>' +
      s.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
  }).join('');

  /* ---------- 弹窗 ---------- */
  $('#modals').innerHTML = Object.keys(D.modals).map(function (id) {
    var m = D.modals[id];
    var duties = m.duties.map(function (d, i) {
      return '<div class="duty d-' + (i % 4) + '"><div class="duty-top">' + esc(d.t) + '</div><ul>' +
        d.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var results = m.results.map(function (r) {
      return '<div class="result"><div class="num">' + esc(r.num) + '</div><div class="lab">' + esc(r.label) + '</div></div>';
    }).join('');
    return '<div class="mask" id="' + id + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '-t" aria-hidden="true">' +
      '<div class="modal">' +
      '<div class="m-banner b-' + m.color + '"><h3 id="' + id + '-t">' + esc(m.title) + '</h3>' + (m.en ? '<em>' + esc(m.en) + '</em>' : '') + '</div>' +
      (m.subtitle ? '<div class="m-sub">' + esc(m.subtitle) + '</div>' : '') +
      '<div class="m-h">核心职责</div><div class="m-en">CORE RESPONSIBILITIES</div>' +
      '<div class="duties n' + m.duties.length + '">' + duties + '</div>' +
      '<div class="m-h">核心成果</div><div class="m-en">CORE RESULTS</div>' +
      '<div class="results' + (m.results.length === 2 ? ' n2' : '') + '">' + results + '</div>' +
      '<button class="m-close" type="button">关闭</button></div></div>';
  }).join('');

  var lastTrigger = null;
  function openModal(id, trigger) {
    var m = document.getElementById(id);
    if (!m) return;
    lastTrigger = trigger || null;
    m.classList.add('open');
    m.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    var btn = $('.m-close', m);
    // mask 此刻仍是 visibility:hidden，等下一帧可见后再聚焦
    setTimeout(function () { if (btn) btn.focus({ preventScroll: true }); }, 30);
  }
  function closeModal() {
    $$('.mask.open').forEach(function (m) {
      m.classList.remove('open');
      m.setAttribute('aria-hidden', 'true');
      var box = $('.modal', m); if (box) box.scrollTop = 0;
    });
    document.body.classList.remove('no-scroll');
    if (lastTrigger) { lastTrigger.focus({ preventScroll: true }); lastTrigger = null; }
  }

  document.addEventListener('click', function (e) {
    var card = e.target.closest('[data-modal]');
    if (card) { openModal(card.getAttribute('data-modal'), card); return; }
    if (e.target.classList.contains('mask')) { closeModal(); return; }   // 点遮罩空白
    if (e.target.closest('.m-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Tab') {                                               // 焦点留在弹窗内
      var open = $('.mask.open .modal');
      if (!open) return;
      var f = $$('button,a[href]', open);
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- 导航：吸顶分隔线 + 滚动高亮 ---------- */
  var nav = $('#nav');
  var links = $$('.nav-links a');
  var secs = links.map(function (a) { return document.getElementById(a.getAttribute('data-sec')); });
  var ticking = false;
  function onScroll() {
    nav.classList.toggle('scrolled', window.scrollY > 10);
    var cur = secs[0] ? secs[0].id : '';
    var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
    if (atBottom) {
      cur = secs[secs.length - 1].id;
    } else {
      secs.forEach(function (s) {
        var r = s.getBoundingClientRect();
        if (r.top <= 120 && r.bottom > 120) cur = s.id;
      });
    }
    links.forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-sec') === cur); });
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
})();

</script>
